name: Daily AI Team Discussion

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0시 = KST 오전 9시
  workflow_dispatch:       # 수동 실행 가능

jobs:
  discuss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select topic
        id: topic
        run: |
          # 총 실행 횟수 기반으로 주제 순환 선택
          TOTAL_TOPICS=$(wc -l < topics.txt)
          RUN_NUMBER=${{ github.run_number }}
          LINE=$(( (RUN_NUMBER - 1) % TOTAL_TOPICS + 1 ))
          TOPIC=$(sed -n "${LINE}p" topics.txt)
          echo "topic=$TOPIC" >> $GITHUB_OUTPUT
          echo "Selected topic ($LINE/$TOTAL_TOPICS): $TOPIC"

      - name: Run discussion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCUSSION_TOPIC: ${{ steps.topic.outputs.topic }}
        run: python ai_team_discussion.py --mode auto

      - name: Commit discussion log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "Add discussion log $(date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d '{"text":"⚠️ AI Team Discussion 실패! Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
